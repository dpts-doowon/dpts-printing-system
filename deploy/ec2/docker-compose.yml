# Implantação barata em UM servidor (EC2): banco, API, site e proxy HTTPS em contêineres.
# PROVISÓRIO (homologação): a composição de produção (primeiro administrador, tokens por posto, retenção) é fatia futura.
# Uso: veja deploy/ec2/README.md. Contexto de build = raiz do repositório.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
      POSTGRES_DB: traceability
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d traceability"]
      interval: 10s
      timeout: 5s
      retries: 6
    # Sem "ports": o banco só é alcançável pelos outros contêineres.

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://app:${DB_PASSWORD}@db:5432/traceability
      WEB_ORIGIN: ${PUBLIC_URL:?defina PUBLIC_URL no .env}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?defina SEED_ADMIN_PASSWORD no .env}
      SEED_OPERATOR_PASSWORD: ${SEED_OPERATOR_PASSWORD:?defina SEED_OPERATOR_PASSWORD no .env}
      AGENT_TOKEN_ST1: ${AGENT_TOKEN_ST1:?defina AGENT_TOKEN_ST1 no .env}
      AGENT_TOKEN_ST2: ${AGENT_TOKEN_ST2:?defina AGENT_TOKEN_ST2 no .env}
      FORCED_LOGOUT_TIMES: ${FORCED_LOGOUT_TIMES:-15:30,00:30}
      TZ: America/Sao_Paulo

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        # Mesma origem: o proxy encaminha /api para a API.
        NEXT_PUBLIC_API_URL: /api
    restart: unless-stopped
    depends_on:
      - api

  proxy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - web
      - api
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Com um domínio (ex.: etiquetas.exemplo.com) o Caddy obtém o certificado HTTPS sozinho.
      # Sem domínio, deixe ":80" (HTTP; restrinja o acesso por IP no grupo de segurança).
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  dbdata:
  caddy_data:
  caddy_config:
